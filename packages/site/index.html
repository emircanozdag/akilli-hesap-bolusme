<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SplitTab</title>
    <meta name="description" content="Scan the receipt. Split the tab fairly." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0e1a;
        --text: #e8ecf4;
        --muted: #9aa3b8;
        --accent: #6ea8ff;
        --border: #243049;
        --card: #141a2e;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main { text-align: center; padding: 2rem; }
      a {
        color: var(--accent);
        text-decoration: none;
        display: inline-block;
        margin: 0.4rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SplitTab</h1>
      <p style="color: var(--muted)">Scan the receipt. Split the tab fairly.</p>
      <p>
        <a href="/privacy/">Privacy Policy</a>
        <a href="mailto:emircanozdag@gmail.com">Support</a>
      </p>
    </main>
  </body>
</html>
